services:
  app:
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-http://registry:4873/}
      network: offline-dev-vault_vault
    restart: unless-stopped
    environment:
      PGHOST: db
      NESHAN_API_KEY: ${NESHAN_API_KEY:-}
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-care_handoff_log}
      PGUSER: ${POSTGRES_USER:-app}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set_POSTGRES_PASSWORD_in_.env}
    ports:
      - ${APP_PORT:-3103}:3000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD","node","-e","fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
  db:
    image: postgres:18.6-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-care_handoff_log}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set_POSTGRES_PASSWORD_in_.env}
    ports:
      - ${POSTGRES_PORT:-5543}:5432
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/migrations/001_bootstrap.sql:/docker-entrypoint-initdb.d/001_bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8
volumes:
  postgres_data:
